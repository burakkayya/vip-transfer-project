# Yerel geliştirme altyapısı: PostgreSQL + PostGIS ve Redis.
# INF-11: image'lar etiket + digest ile sabit (etiket bilgi amaçlıdır, çekilen içerik digest'le belirlenir).
# Dependabot (docker-compose ekosistemi) etiket ve digest'i birlikte günceller; aynı değerler
# .github/workflows/ci.yml ve android-emulator.yml servislerinde de elle eş tutulur.
# DB-10 / RT-01: portlar yalnızca 127.0.0.1'e bağlanır; aynı ağdaki başka makineler erişemez.
# Bu dosyadaki değişiklik çalışan konteynerlere `docker compose up -d` ile yeniden oluşturulduklarında uygulanır.
services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_USER: getaway
      POSTGRES_PASSWORD: getaway
      POSTGRES_DB: getaway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getaway"]
      interval: 5s
      retries: 10

  # RT-01: parolasız Redis ağdaki herkese açık olmasın. Parola yalnızca yerel geliştirme içindir
  # (backend/app/config.py redis_url varsayılanıyla aynı); üretimde reddedilir.
  redis:
    image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: ["redis-server", "--requirepass", "getaway-redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "getaway-redis", "--no-auth-warning", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
