# Gerçek iOS uygulamalarının (müşteri + sürücü) iPhone simülatöründe uçtan uca testi.
# Mac makinede backend (PostgreSQL+PostGIS, Redis, sahte SMS/ödeme) kurulur, iki uygulama Release
# olarak simülatör için derlenir, Maestro akışları (.maestro/ios) ekranlarda gezinir.
# Çıktı: ekran görüntüleri, video ve backend günlüğü "ios-simulator-sonuc" yapıtında.
# Mac dakikası pahalı olduğu için her PR'da değil, elle veya ci/ios-* dalına gönderimde çalışır.
# K-77: iki dil paralel koşar. "tr" uçtan uca testtir; "en" simülatörü İngilizce açar, müşteri akışlarını
# .maestro/ios/en altındaki İngilizce kopyalarıyla çalıştırır ve temiz durum çubuğuyla (9:41, tam pil)
# reklamda kullanılabilecek tam çözünürlüklü (1206x2622) İngilizce ekran görüntüleri üretir.
name: iOS simülatör

on:
  workflow_dispatch:
  push:
    branches: ["ci/ios-*"]

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GETAWAY_ENV: dev
  GETAWAY_DATABASE_URL: postgresql+psycopg://getaway:getaway@localhost:5432/getaway
  GETAWAY_REDIS_URL: redis://localhost:6379/0
  GETAWAY_SMS_PROVIDER: console
  GETAWAY_PAYMENT_PROVIDER: fake
  # K-58: haritayla ilgili her şey Google (yedek yok). Anahtarlar depo gizli değişkenlerinden gelir
  # (Settings → Secrets and variables → Actions); günlükte GitHub tarafından maskelenir.
  # INF-06: gizli değerler burada (iş akışı düzeyinde) TANIMLANMAZ; yalnızca ihtiyaç duyan adımın env'ine
  # yazılır. Böylece brew/pip/npm kurulum betikleri, xcodebuild ve Maestro anahtarı görmez.
  GETAWAY_PLACES_PROVIDER: google
  GETAWAY_ROUTING_PROVIDER: google
  GETAWAY_PUSH_PROVIDER: console
  # Simülatör Mac'in ağını kullanır: localhost backend'dir. Ödeme ve yasal sayfalar da backend'den.
  GETAWAY_API_URL: http://localhost:8000
  GETAWAY_WEB_URL: http://localhost:8000
  GETAWAY_PUBLIC_WEB_URL: http://localhost:8000
  OUT: ${{ github.workspace }}/ios-out

jobs:
  ios:
    name: iOS simülatör (Maestro, ${{ matrix.lang }})
    strategy:
      fail-fast: false
      matrix:
        lang: [tr, en]
    env:
      LANG_CODE: ${{ matrix.lang }}
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Google anahtarları tanımlı mı
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
          IOS_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_IOS_KEY }}
          ANDROID_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          for N in GETAWAY_GOOGLE_MAPS_API_KEY IOS_KEY ANDROID_KEY; do
            [ -n "${!N}" ] || { echo "::error::Depo gizli değişkeni eksik: $N (Settings → Secrets → Actions)"; exit 1; }
          done

      - name: Ortam bilgisi
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          mkdir -p "$OUT"

      # ---------- Backend ----------
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: PostgreSQL + PostGIS + Redis
        run: |
          # Homebrew postgis eklentiyi postgresql@17 ve @18 için kurar ama sunucuyu kurmaz.
          PG=postgresql@18
          brew install "$PG" postgis redis
          brew services start "$PG"
          brew services start redis
          PGBIN="$(brew --prefix "$PG")/bin"
          for i in $(seq 1 30); do "$PGBIN/pg_isready" -h localhost && break; sleep 1; done
          "$PGBIN/psql" -h localhost -d postgres -c "CREATE ROLE getaway LOGIN SUPERUSER PASSWORD 'getaway';"
          "$PGBIN/createdb" -h localhost -O getaway getaway
      - name: Backend kurulum
        working-directory: backend
        run: pip install -r requirements.txt
      # Ayar doğrulaması (K-58) Google anahtarını ister; anahtar pip kurulumuna değil yalnız bu adıma verilir (INF-06).
      - name: Veritabanı ve tohum veri
        working-directory: backend
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli seed-demo
      # Harita anahtarı yalnızca çalışan backend sürecine verilir (arka planda kalan uvicorn bu env'i devralır).
      - name: Backend'i başlat
        working-directory: backend
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$OUT/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/docs > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/docs > /dev/null && echo "API hazır"

      # ---------- iOS derlemeleri ----------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Yalnızca Maestro akışı veya iş akışı değiştiyse yeniden derleme yapılmaz (derleme ~30-55 dk).
      # Derlemeye gömülen adresler anahtarda; derleme adımı (xcodebuild bayrakları) değişirse "v3" elle artırılır.
      - name: Derleme önbelleği
        id: appcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios-apps
          key: ios-apps-v4-${{ runner.os }}-${{ hashFiles('mobile/app/**', 'mobile/components/**', 'mobile/lib/**', 'mobile/widgets/**', 'mobile/assets/**', 'mobile/app.config.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json') }}-${{ env.GETAWAY_API_URL }}-${{ env.GETAWAY_WEB_URL }}-${{ env.GETAWAY_PUBLIC_WEB_URL }}
      - name: Uygulamaları derle (müşteri, sürücü)
        if: steps.appcache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          # iOS Google Maps SDK anahtarı derlemeye gömülür (bundle ID kısıtlı). Anahtar değişirse önbellek
          # anahtarındaki "v4" elle artırılır.
          GETAWAY_GOOGLE_MAPS_IOS_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_IOS_KEY }}
        run: |
          npm ci
          mkdir -p ../ios-apps
          for V in customer driver; do
            echo "::group::$V"
            APP_VARIANT=$V npx expo prebuild --platform ios --clean
            WS=$(ls -d ios/*.xcworkspace | head -1)
            # Uygulama şeması çalışma alanıyla aynı adı taşır (listede Pod şemaları da var).
            SCHEME=$(basename "$WS" .xcworkspace)
            echo "Workspace: $WS  Scheme: $SCHEME"
            # Simülatör için yerel imza ("Sign to Run Locally", takım gerekmez): Xcode yetkileri (Keychain dahil)
            # binary'ye gömer. İmzasız derlemede expo-secure-store okunamıyor; sonradan ad-hoc imza ise açılışta reddediliyor.
            # Yalnız arm64 (Apple Silicon simülatörü): x86_64 dilimi derleme süresini ikiye katlıyordu.
            APP_VARIANT=$V xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              -derivedDataPath "build-$V" -quiet \
              CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
            APP=$(ls -d build-$V/Build/Products/Release-iphonesimulator/*.app | head -1)
            codesign -d --entitlements - "$APP" || true
            cp -R "$APP" "../ios-apps/$V.app"
            echo "::endgroup::"
          done
          ls ../ios-apps
      # Sonraki adımlar başarısız olsa da (veya iş iptal edilse de) derleme saklansın.
      - name: Derlemeyi önbelleğe kaydet
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios-apps
          key: ${{ steps.appcache.outputs.cache-primary-key }}

      # ---------- Simülatör ----------
      - name: Simülatörü hazırla (dil matristen, Antalya konumu)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,re,sys
          devs=[d for r,l in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in l]
          # Sahte ödeme sayfasındaki dokunuşlar (02) bu cihazın ölçüsüne göre: başka cihaz seçilmez.
          ph=[d for d in devs if d['name']=='iPhone 17 Pro']
          if not ph: sys.exit('iPhone 17 Pro simülatörü yok; 02 akışındaki koordinatları güncelleyin')
          print(ph[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          if [ "$LANG_CODE" = en ]; then
            xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array en-US
            xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string en_US
          else
            xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array tr-TR
            xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string tr_TR
          fi
          xcrun simctl shutdown "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl location "$UDID" set 36.9002,30.8015
          # Reklam görüntüleri için temiz durum çubuğu (iki dilde de).
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3             --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" ios-apps/customer.app
          xcrun simctl install "$UDID" ios-apps/driver.app
          xcrun simctl list devices | grep "$UDID"

      # INF-06: `curl | bash` yerine sabit sürüm + SHA-256 doğrulaması. Değer yayıncının sürüm sayfasındaki
      # checksums_sha256.txt dosyasından alınır (GitHub asset digest'i ile de aynı). Sürüm yükseltirken ikisi
      # birlikte değişir; android-emulator.yml'deki aynı değerlerle eş tutulur. Kurulum yeri resmi betikle aynıdır.
      # macOS'ta sha256sum her imajda garanti olmadığından shasum kullanılır.
      - name: Maestro kur (sürüm sabit, SHA-256 doğrulamalı)
        env:
          MAESTRO_VERSION: "2.12.1"
          # https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/checksums_sha256.txt
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | shasum -a 256 -c -
          rm -rf maestro-x && unzip -q maestro.zip -d maestro-x
          mkdir -p "$HOME/.maestro"
          rm -rf "$HOME/.maestro/bin" "$HOME/.maestro/lib"
          cp -R maestro-x/maestro/. "$HOME/.maestro/"
          rm -rf maestro.zip maestro-x
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Akışları çalıştır
        run: |
          maestro --version
          mkdir -p "$OUT/screens"
          # Uygulama günlüğü (JS hataları dahil) tüm akış boyunca.
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process CONTAINS "Getaway" OR subsystem == "com.facebook.react.log"' > "$OUT/app.log" 2>&1 &
          LOGP=$!
          # Hızlı kontrol: iki uygulama açılıyor mu (beyaz ekranda takılma görülürse akışlardan önce anlaşılır).
          for B in com.getawaytransfers.app com.getawaytransfers.driver; do
            xcrun simctl launch "$UDID" "$B" || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$OUT/screens/00-acilis-$B.png" || true
            xcrun simctl terminate "$UDID" "$B" || true
          done
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$OUT/simulator.mp4" &
          REC=$!
          sleep 2
          FAIL=0
          cd "$OUT/screens"
          FLOWS=$(ls "$GITHUB_WORKSPACE"/.maestro/ios/[0-9]*.yaml)
          # İngilizce koşuda yalnızca en/ altında olan akışlar (reklam görüntüleri) sona eklenir.
          if [ "$LANG_CODE" = en ]; then
            for E in "$GITHUB_WORKSPACE"/.maestro/ios/en/[0-9]*.yaml; do
              [ -f "$GITHUB_WORKSPACE/.maestro/ios/$(basename "$E")" ] || FLOWS="$FLOWS $E"
            done
          fi
          for F in $FLOWS; do
            N=$(basename "$F" .yaml)
            # Reklam akışından önce sürücü uygulaması kaldırılır: canlı etkinliği ve geri dönüş etiketi kalmaz.
            if [ "$N" = 06-reklam-goruntuleri ]; then
              xcrun simctl uninstall "$UDID" com.getawaytransfers.driver || true
            fi
            # İngilizce koşuda müşteri akışlarının İngilizce kopyası kullanılır (sürücü uygulaması Türkçedir).
            if [ "$LANG_CODE" = en ] && [ -f "$GITHUB_WORKSPACE/.maestro/ios/en/$N.yaml" ]; then
              F="$GITHUB_WORKSPACE/.maestro/ios/en/$N.yaml"
            fi
            echo "::group::$N"
            run_flow() {
              maestro --device "$UDID" test "$F" --format junit --output "$OUT/$N.xml" --debug-output "$OUT/debug/$N"
            }
            # Maestro'nun XCUITest sürücüsü ara sıra bağlanamıyor (akış hiç başlamaz, sonuç dosyası yazılmaz):
            # yalnızca bu durumda bir kez yeniden denenir. Akış içindeki gerçek hata yeniden denenmez.
            if run_flow || { { [ ! -s "$OUT/$N.xml" ] || grep -qE "DeviceUnreachable|DeviceServerDied" "$OUT/$N.xml"; } && echo "Sürücü bağlanamadı ya da bağlantı koptu, $N yeniden deneniyor" && sleep 10 && run_flow; }; then
              echo "OK $N" | tee -a "$OUT/ozet.txt"
            else
              echo "HATA $N" | tee -a "$OUT/ozet.txt"; FAIL=1
              xcrun simctl io "$UDID" screenshot "$OUT/screens/HATA-$N.png" || true
              # Maestro'nun gördüğü erişilebilirlik ağacı (seçici neden bulunamadı?).
              maestro --device "$UDID" hierarchy > "$OUT/screens/HATA-$N-agac.json" 2>/dev/null || true
            fi
            echo "::endgroup::"
          done
          # Maestro takeScreenshot dosyaları akış dosyasının klasörüne de yazılabiliyor: tek yerde toplanır.
          cp "$GITHUB_WORKSPACE"/.maestro/ios/*.png "$GITHUB_WORKSPACE"/.maestro/ios/en/*.png "$OUT/screens/" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" "$HOME/.maestro" -name "[msr][0-9][0-9]*-*.png" -not -path "$OUT/screens/*" \
            -exec cp {} "$OUT/screens/" \; 2>/dev/null || true
          ls "$OUT/screens"
          kill -INT $REC || true
          wait $REC || true
          kill $LOGP || true
          # Asıl video yüzlerce MB: telefondan izlenebilsin diye küçük kopya (360 px, 10 kare/sn).
          brew install ffmpeg > /dev/null 2>&1 && ffmpeg -loglevel error -y -i "$OUT/simulator.mp4" \
            -vf "fps=10,scale=360:-2" -c:v libx264 -crf 32 -preset veryfast -an "$OUT/simulator-kucuk.mp4" || true
          ls -la "$OUT"/*.mp4 || true
          cat "$OUT/ozet.txt"
          exit $FAIL

      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-sonuc-${{ matrix.lang }}
          path: |
            ios-out
            ~/.maestro/tests
          retention-days: 14
