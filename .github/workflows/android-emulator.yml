# Gerçek Android uygulamalarının (müşteri + sürücü) emülatörde uçtan uca testi.
# Linux makinede backend (PostgreSQL+PostGIS, Redis, sahte SMS/ödeme) kurulur, iki uygulama sürüm (release)
# APK olarak derlenir, Maestro akışları (.maestro/android) ekranlarda gezinir.
# Çıktı: ekran görüntüleri, video (asıl ve küçük kopya), uygulama ve backend günlüğü "android-emulator-sonuc" yapıtında.
# Her PR'da değil, elle veya ci/ios-*, ci/android-* dallarına gönderimde çalışır.
name: Android emülatör

on:
  workflow_dispatch:
  push:
    branches: ["ci/ios-*", "ci/android-*"]

concurrency:
  group: android-emu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GETAWAY_ENV: dev
  GETAWAY_DATABASE_URL: postgresql+psycopg://getaway:getaway@localhost:5432/getaway
  GETAWAY_REDIS_URL: redis://localhost:6379/0
  GETAWAY_SMS_PROVIDER: console
  GETAWAY_PAYMENT_PROVIDER: fake
  # K-58: haritayla ilgili her şey Google (yedek yok). Anahtarlar depo gizli değişkenlerinden gelir
  # (Settings → Secrets and variables → Actions); günlükte GitHub tarafından maskelenir.
  # INF-06: gizli değerler burada (iş akışı düzeyinde) TANIMLANMAZ; yalnızca ihtiyaç duyan adımın env'ine
  # yazılır. Böylece pip/npm kurulum betikleri, Gradle ve üçüncü taraf action anahtarı görmez.
  GETAWAY_PLACES_PROVIDER: google
  GETAWAY_ROUTING_PROVIDER: google
  GETAWAY_PUSH_PROVIDER: console
  GETAWAY_PUBLIC_WEB_URL: http://localhost:8000
  OUT: ${{ github.workspace }}/android-out

jobs:
  android:
    name: Android emülatör (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # INF-11: image'lar etiket + digest ile sabit ve docker-compose.yml / ci.yml ile aynı (tek Postgres major).
    # Digest değişirse üç dosya birlikte güncellenir (Dependabot yalnızca docker-compose.yml'i izler).
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: getaway
          POSTGRES_PASSWORD: getaway
          POSTGRES_DB: getaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getaway" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Google anahtarları tanımlı mı
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
          IOS_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_IOS_KEY }}
          ANDROID_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          for N in GETAWAY_GOOGLE_MAPS_API_KEY IOS_KEY ANDROID_KEY; do
            [ -n "${!N}" ] || { echo "::error::Depo gizli değişkeni eksik: $N (Settings → Secrets → Actions)"; exit 1; }
          done
      - run: mkdir -p "$OUT"

      # ---------- Backend ----------
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend kurulum
        working-directory: backend
        run: pip install -r requirements.txt
      # Ayar doğrulaması (K-58) Google anahtarını ister; anahtar pip kurulumuna değil yalnız bu adıma verilir (INF-06).
      - name: Veritabanı ve tohum veri
        working-directory: backend
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli seed-demo
      # Harita anahtarı yalnızca çalışan backend sürecine verilir (arka planda kalan uvicorn bu env'i devralır).
      - name: Backend'i başlat
        working-directory: backend
        env:
          GETAWAY_GOOGLE_MAPS_API_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_API_KEY }}
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$OUT/backend.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/docs > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/docs > /dev/null && echo "API hazır"

      # ---------- Android derlemeleri ----------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Uygulama kodu değişmediyse derleme önbellekten gelir. Derleme adımı değişirse "v1" elle artırılır.
      - name: Derleme önbelleği
        id: apkcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android-apps
          key: android-apps-v3-${{ hashFiles('mobile/app/**', 'mobile/components/**', 'mobile/lib/**', 'mobile/widgets/**', 'mobile/assets/**', 'mobile/app.config.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json') }}
      - name: Uygulamaları derle (müşteri, sürücü)
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          # Emülatör bilgisayara 10.0.2.2 ile ulaşır; sürüm derlemesinde düz HTTP yalnızca bu test için açılır.
          GETAWAY_API_URL: http://10.0.2.2:8000
          GETAWAY_WEB_URL: http://10.0.2.2:8000
          GETAWAY_ANDROID_CLEARTEXT: "1"
          # Android Google Maps SDK anahtarı (paket adı + Expo hata ayıklama imzası SHA-1 kısıtlı). Anahtar
          # değişirse önbellek anahtarındaki "v3" elle artırılır.
          GETAWAY_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GETAWAY_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          npm ci
          mkdir -p ../android-apps
          for V in customer driver; do
            echo "::group::$V"
            # Gradle de uygulama yapılandırmasını (app.config.ts) okur: çeşit değişkeni derlemede de verilmeli,
            # yoksa sürücü paketine müşteri ayarları gömülür.
            export APP_VARIANT=$V
            npx expo prebuild --platform android --clean
            (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q)
            cp android/app/build/outputs/apk/release/app-release.apk "../android-apps/$V.apk"
            echo "::endgroup::"
          done
          ls -la ../android-apps
      - name: Derlemeyi önbelleğe kaydet
        if: steps.apkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android-apps
          key: ${{ steps.apkcache.outputs.cache-primary-key }}

      # ---------- Emülatör ve akışlar ----------
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Araçlar (ffmpeg, psql)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg postgresql-client > /dev/null
      # INF-06: `curl | bash` yerine sabit sürüm + SHA-256 doğrulaması. Değer yayıncının sürüm sayfasındaki
      # checksums_sha256.txt dosyasından alınır (GitHub asset digest'i ile de aynı). Sürüm yükseltirken ikisi
      # birlikte değişir; ios-simulator.yml'deki aynı değerlerle eş tutulur. Kurulum yeri resmi betikle aynıdır
      # (~/.maestro/bin, ~/.maestro/lib); akış çıktıları ~/.maestro/tests altına yazılmaya devam eder.
      - name: Maestro kur (sürüm sabit, SHA-256 doğrulamalı)
        env:
          MAESTRO_VERSION: "2.12.1"
          # https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/checksums_sha256.txt
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          rm -rf maestro-x && unzip -q maestro.zip -d maestro-x
          mkdir -p "$HOME/.maestro"
          rm -rf "$HOME/.maestro/bin" "$HOME/.maestro/lib"
          cp -R maestro-x/maestro/. "$HOME/.maestro/"
          rm -rf maestro.zip maestro-x
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Akışları çalıştır
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Kapalı animasyonlarda Reanimated giriş animasyonları bitmiyor, paneller boş kalıyor.
          disable-animations: false
          script: bash .github/scripts/android-flows.sh

      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-sonuc
          path: |
            android-out
            ~/.maestro/tests
          retention-days: 14
