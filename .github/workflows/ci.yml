# Her PR'da ve main'e her gönderimde testler, tip denetimi ve lint taban çizgisi (K-53).
# Gizli anahtar gerekmez: backend testleri sahte sağlayıcılarla (SMS, ödeme, rota, adres) çalışır.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # INF-11: image'lar etiket + digest ile sabit ve docker-compose.yml ile aynı. Digest değişirse
    # docker-compose.yml, ci.yml ve android-emulator.yml birlikte güncellenir.
    services:
      db:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: getaway
          POSTGRES_PASSWORD: getaway
          POSTGRES_DB: getaway_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getaway"
          --health-interval 5s
          --health-retries 20
      redis:
        image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      GETAWAY_DATABASE_URL: postgresql+psycopg://getaway:getaway@localhost:5432/getaway_test
      GETAWAY_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Bağımlılıklar
        run: pip install --require-hashes -r requirements.lock
      - name: Testler
        run: python -m pytest -q

  mobile:
    name: Mobil (tsc, jest, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Birim testleri
        run: npm test -- --ci
      - name: Lint taban çizgisi
        run: node ../scripts/lint-baseline.mjs mobile

  web:
    name: ${{ matrix.app }} (tsc, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Tip denetimi
        run: npm run typecheck
      - name: Lint taban çizgisi
        run: node ../scripts/lint-baseline.mjs ${{ matrix.app }}

  build:
    name: ${{ matrix.app }} (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Üretim derlemesi
        run: npm run build

  # K-81: web ve admin Playwright + axe testleri. Backend test modunda sahte sağlayıcılarla (SMS konsol, ödeme sahte,
  # adres sahte, rota kuş uçuşu) çalışır; gizli anahtar gerekmez. Admin e2e hesabının parolası her koşuda rastgele
  # üretilir ve maskelenir; TOTP sırrı ilk girişte Playwright kurulumunda alınır. İlk koşular GitHub'da görülene kadar
  # iş bilgi amaçlıdır (continue-on-error); kararlı geçince zorunlu yapılır (docs/acik_konular.md).
  e2e:
    name: Web ve admin e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    services:
      db:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: getaway
          POSTGRES_PASSWORD: getaway
          POSTGRES_DB: getaway_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getaway"
          --health-interval 5s
          --health-retries 20
      redis:
        image: redis:7.4.12-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
        ports: ["6379:6379"]
    env:
      GETAWAY_ENV: test
      GETAWAY_DATABASE_URL: postgresql+psycopg://getaway:getaway@localhost:5432/getaway_e2e
      GETAWAY_REDIS_URL: redis://localhost:6379/14
      GETAWAY_SMS_PROVIDER: console
      GETAWAY_PAYMENT_PROVIDER: fake
      GETAWAY_ROUTING_PROVIDER: haversine
      GETAWAY_PLACES_PROVIDER: fake
      GETAWAY_PUSH_PROVIDER: console
      GETAWAY_OTP_MAX_PER_IP_PER_HOUR: "100000"
      GETAWAY_OTP_GLOBAL_MAX_PER_HOUR: "100000"
      GETAWAY_OTP_GLOBAL_HARD_LIMIT_PER_HOUR: "100000"
      # Paralel e2e testleri tek IP'den çok fiyat sorgusu atar; üretim sınırı (60/dk) burada 429'a yol açar.
      GETAWAY_QUOTES_RATE_LIMIT_PER_MINUTE: "100000"
      GETAWAY_QUOTES_GLOBAL_RATE_LIMIT_PER_MINUTE: "100000"
      ALLOWED_ORIGINS: http://localhost:3000 http://localhost:3001
      ADMIN_E2E_EMAIL: e2e-admin@getawaytransfers.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin/package-lock.json
      - name: Backend bağımlılıkları, şema ve örnek veri
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements.lock
          alembic upgrade head
          python -m app.cli seed
          python -m app.cli seed-demo
      - name: E2E admin hesabı (rastgele parola)
        working-directory: backend
        run: |
          ADMIN_E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$ADMIN_E2E_PASSWORD"
          echo "ADMIN_E2E_PASSWORD=$ADMIN_E2E_PASSWORD" >> "$GITHUB_ENV"
          ADMIN_E2E_PASSWORD="$ADMIN_E2E_PASSWORD" python - <<'PY'
          import os
          from app.db import SessionLocal
          from app.models.enums import RoleCode
          from app.services import auth
          with SessionLocal() as db:
              auth.ensure_roles(db)
              auth.create_staff_user(db, email=os.environ["ADMIN_E2E_EMAIL"], password=os.environ["ADMIN_E2E_PASSWORD"],
                                     roles=[RoleCode.ADMIN], actor_id=None)
              db.commit()
          PY
      - name: Backend sunucusu
        working-directory: backend
        run: nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Web ve admin derleme ve sunucu
        run: |
          (cd web && npm ci && npm run build && (nohup npm run start > "$RUNNER_TEMP/web.log" 2>&1 &))
          (cd admin && npm ci && npm run build && (nohup npm run start > "$RUNNER_TEMP/admin.log" 2>&1 &))
      - name: Sunucuları bekle
        run: |
          for url in http://localhost:8000/health http://localhost:3000/tr http://localhost:3001/login; do
            for i in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
      - name: Playwright tarayıcısı
        working-directory: web
        run: npx playwright install --with-deps chromium
      # `github` raporcusu her düşen testi açıklama (annotation) olarak yazar; açıklamalar giriş yapmadan da
      # API'den okunur. Admin e2e, web e2e düşse de koşar.
      - name: Web e2e
        working-directory: web
        run: npx playwright test --workers=2 --reporter=list,github
      - name: Admin e2e
        if: ${{ !cancelled() }}
        working-directory: admin
        run: npx playwright test --workers=1 --reporter=list,github
      - name: Sunucu logları
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/*.log

  scripts:
    name: Kök betikler ve renk tokenları
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Betik testleri
        run: node --test scripts/*.test.mjs
      - name: Token uyumu
        run: node scripts/sync-tokens.mjs --check
