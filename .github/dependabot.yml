# Bağımlılık güncellemeleri (INF-07, INF-08). Haftalık; küçük/yama güncellemeleri ekosistem başına tek PR'da
# toplanır. Major sürüm PR'ı açılmaz (2026-11-22): Next, ESLint, TypeScript, redis-py gibi major geçişler kod
# uyarlaması ister, planlı iş olarak elle yapılır. İstisna GitHub Actions: action major'ları (ör. Node 24'e geçiş)
# genelde yalnızca SHA değişikliğidir, tek grup PR olarak gelmeye devam eder.
# Güvenlik güncellemeleri (Dependabot security updates) depo ayarından açılır ve bu takvimi beklemez.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Next ve eşlik eden paketler birlikte güncellenir (eslint-config-next sürümü next ile aynı kalmalı).
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
        update-types: [minor, patch]
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
        update-types: [minor, patch]
      admin-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    # Expo SDK sürümleri birbirine kilitlidir: major yükseltme `npx expo install --fix` / SDK geçişiyle elle yapılır.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Sürümü Expo SDK'nın belirlediği modüller: Dependabot bunları SDK'nın beklediğinin üstüne çıkarıyor
      # (2026-11-22, PR #45/#46). SDK yama güncellemesinde `npx expo install --fix` ile birlikte yükseltilir.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@react-native-community/datetimepicker"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # Birleştirmeden önce `npx expo install --check`: Dependabot react-native-* modüllerini SDK'nın beklediği
      # sürümün üstüne çıkarabilir; bu durumda `npx expo install --fix` ile SDK sürümüne geri çekilir.
      expo-sdk:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*", "@react-native/*", "react", "react-dom"]
        update-types: [minor, patch]
      mobile-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /scripts/ui-shots
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ui-shots:
        patterns: ["*"]

  # Workflow'lardaki action'lar commit SHA ile sabit; Dependabot SHA'yı ve sürüm yorumunu birlikte günceller.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # INF-11: docker-compose.yml image'ları etiket + digest ile sabit; Dependabot ikisini birlikte günceller.
  # Postgres/PostGIS ve Redis major geçişleri veri uyumluluğu gerektirir, elle yapılır. Aynı image'lar
  # ci.yml ve android-emulator.yml `services:` altında da var; Dependabot oraları güncellemez, PR'da elle eşlenir.
  # `docker` ekosistemi eklenmedi: depoda Dockerfile yok (prod Dockerfile yazıldığında eklenecek).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
