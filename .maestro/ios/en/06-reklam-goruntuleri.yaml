# K-77 reklam görüntüleri (yalnızca İngilizce koşu). İş akışı bu akıştan önce sürücü uygulamasını kaldırır:
# Dynamic Island ve kilit ekranında yalnız müşterinin (İngilizce) canlı etkinliği kalır, durum çubuğunda
# "◀ Getaway Sürücü" geri dönüş etiketi çıkmaz. Harita karoları yüklensin diye her haritalı ekranda beklenir.
appId: com.getawaytransfers.app
---
- pressKey: Home
- launchApp:
    stopApp: true
- tapOn:
    text: "Allow|Allow While Using App"
    optional: true
- extendedWaitUntil:
    visible: 'Where to\?'
    timeout: 60000
# Harita karoları (düz bekleme komutu yok: boş alana uzun basış).
- swipe:
    start: "50%,8%"
    end: "50%,8%"
    duration: 7000
- takeScreenshot: r01-home
# Rota ve araçlar (rezervasyon oluşturulmaz).
- tapOn: ".*Antalya Airport.*"
- extendedWaitUntil:
    visible: ".*Your route.*"
    timeout: 15000
- tapOn: "To"
- inputText: "Kemer Marina"
- extendedWaitUntil:
    visible: "Kemer Marina, .*"
    timeout: 20000
- tapOn: "Kemer Marina, .*"
- tapOn: "Show prices.*"
- extendedWaitUntil:
    visible: "Choose .* · .*"
    timeout: 30000
- swipe:
    start: "50%,8%"
    end: "50%,8%"
    duration: 6000
- takeScreenshot: r02-vehicles
- tapOn: ".*VIP Van.*"
- swipe:
    start: "50%,8%"
    end: "50%,8%"
    duration: 1500
- takeScreenshot: r03-vehicles-vip
# Sürücüsü yolda olan rezervasyon: harita, sürücü kartı, buluşma araçları.
- tapOn: ".*My bookings.*"
- tapOn: ".*(On the way|Driver assigned|Driver on the way).*"
- extendedWaitUntil:
    visible: ".*(on the way|On the way).*"
    timeout: 30000
- swipe:
    start: "50%,8%"
    end: "50%,8%"
    duration: 7000
- takeScreenshot: r04-live-tracking
- scrollUntilVisible:
    element: ".*Let your driver know where you are.*"
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: r05-driver-card
- tapOn:
    text: ".*Directions to the meeting point.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: ".*After passport control.*"
    direction: DOWN
    centerElement: true
    optional: true
- takeScreenshot: r06-meeting-guide
# Canlı etkinlik: Dynamic Island ve kilit ekranı (yalnız müşterinin etkinliği).
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: r07-dynamic-island
- swipe:
    start: "25%,1%"
    end: "25%,75%"
    duration: 500
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: r08-lock-screen
- swipe:
    start: "50%,98%"
    end: "50%,20%"
    duration: 400
- pressKey: Home
