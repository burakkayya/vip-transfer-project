# Müşteri uygulamasında rezervasyon atanmış ve sürücü yolda görünür.
appId: com.getawaytransfers.app
---
- launchApp:
    stopApp: false
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "Allow|Allow While Using App|İzin Ver"
    optional: true
- extendedWaitUntil:
    visible: ".*(on the way|On the way|assigned|Assigned).*"
    timeout: 40000
    optional: true
# 02 bağlantı kopması yüzünden yeniden denendiyse iki rezervasyon olur ve açık ekran sürücünün kabul ettiği
# rezervasyon olmayabilir: uygulama yeniden açılır, "Rezervasyonlarım"dan atanmış rezervasyon seçilir.
- runFlow:
    when:
      notVisible: ".*(on the way|On the way|assigned|Assigned).*"
    commands:
      - launchApp:
          stopApp: true
      - tapOn: ".*My bookings.*"
      - tapOn: ".*(on the way|On the way|assigned|Assigned).*"
- extendedWaitUntil:
    visible: ".*(on the way|On the way|assigned|Assigned).*"
    timeout: 40000
- takeScreenshot: m15-canli-takip
# Reklam: buluşma araçları (yolcu durumu, rehber) ve sürücü kartı.
- scrollUntilVisible:
    element: ".*Directions to the meeting point.*"
    direction: DOWN
    optional: true
- takeScreenshot: m15b-bulusma-araclari
- tapOn:
    text: ".*Directions to the meeting point.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m15c-bulusma-rehberi
- scrollUntilVisible:
    element: "Cancel booking"
    direction: DOWN
    optional: true
- takeScreenshot: m16-rezervasyon-alt
# K-59: müşteri uygulaması arka plandayken yolculuk durumu Dynamic Island'da ve bildirim merkezinde.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m17-canli-etkinlik-ada
- swipe:
    start: "25%,1%"
    end: "25%,75%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m18-canli-etkinlik-bildirim
- swipe:
    start: "50%,98%"
    end: "50%,20%"
    duration: 400
- pressKey: Home
