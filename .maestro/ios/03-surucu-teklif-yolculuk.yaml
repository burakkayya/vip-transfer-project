# Sürücü uygulamasına dönülür: anlık teklif kabul edilir, karşılama tabelası açılır, yola çıkılır.
appId: com.getawaytransfers.driver
---
- launchApp:
    stopApp: false
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "İzin Ver|Uygulamayı Kullanırken İzin Ver"
    optional: true
- extendedWaitUntil:
    visible: "Kabul et"
    timeout: 60000
- takeScreenshot: s05-teklif
- tapOn: "Kabul et"
- extendedWaitUntil:
    visible: ".*Karşılama tabelası.*"
    timeout: 20000
- takeScreenshot: s06-is-atandi
- tapOn: ".*Karşılama tabelası.*"
- takeScreenshot: s07-karsilama-tabelasi
- tapOn: ".*Kapatmak için dokunun.*"
- tapOn: "Yola çıktım"
- takeScreenshot: s08-yolda
