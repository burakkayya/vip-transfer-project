# Yeni müşteri giriş yapar, Antalya Havalimanı → Kemer Marina (ilçe değil, serbest adres; K-58) anlık
# rezervasyon oluşturur ve sahte ödemeyi onaylar. Adres Google Places ile aranır, fiyat gerçek
# noktalar arası karayolu mesafesinden (Google Routes) hesaplanır.
appId: com.getawaytransfers.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "İzin Ver|Uygulamayı Kullanırken İzin Ver"
    optional: true
# iOS'ta clearState anahtar zincirini silmez: bağlantı kopması sonrası yeniden denemede oturum açık
# kalabilir. Giriş adımları yalnızca giriş ekranı çıkarsa çalışır.
- extendedWaitUntil:
    visible: 'Telefon numaranızı girin|Nereye gidiyorsunuz\?'
    timeout: 90000
- runFlow:
    when:
      visible: "Telefon numaranızı girin"
    commands:
      - takeScreenshot: m01-giris
      - tapOn: "532 123 45 67"
      - inputText: "5559011234"
      - tapOn: "Devam"
      - extendedWaitUntil:
          visible: ".*Geliştirme ortamı.*"
          timeout: 20000
      - takeScreenshot: m02-sms-kodu
      - tapOn: ".*Geliştirme ortamı.*"
      - extendedWaitUntil:
          visible: 'Nereye gidiyorsunuz\?|İzin Ver'
          timeout: 30000
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "İzin Ver|Uygulamayı Kullanırken İzin Ver"
    optional: true
- extendedWaitUntil:
    visible: 'Nereye gidiyorsunuz\?'
    timeout: 30000
- takeScreenshot: m03-ana-sayfa
- tapOn: ".*Rezervasyonlarım.*"
- takeScreenshot: m04-rezervasyonlar-bos
- tapOn: ".*Profil.*"
- takeScreenshot: m05-profil
- tapOn: ".*Ana sayfa.*"
- tapOn: ".*Antalya Havalimanı.*"
- extendedWaitUntil:
    visible: ".*Rotanız.*"
    timeout: 15000
- takeScreenshot: m06-rota
- tapOn: "Nereye"
- inputText: "Kemer Marina"
# Sonuç satırının etiketi "başlık, alt başlık": "Kemer Marina, 152 Sokak, Merkez, Kemer, Antalya".
# (Maestro eşleşmesi büyük/küçük harf duyarsız; arama kutusundaki metin virgül içermez.)
- extendedWaitUntil:
    visible: "Kemer Marina, .*"
    timeout: 20000
- takeScreenshot: m07-adres-arama
- tapOn: "Kemer Marina, .*"
- tapOn: ".*Şimdi.*"
- takeScreenshot: m08-rota-dolu
- tapOn: "Fiyatları göster.*"
- extendedWaitUntil:
    visible: ".* seç · .*"
    timeout: 30000
- takeScreenshot: m09-arac-secimi
- tapOn: ".* seç · .*"
- extendedWaitUntil:
    visible: "Yolcu adı soyadı"
    timeout: 15000
- takeScreenshot: m10-bilgiler
- tapOn:
    below: "Yolcu adı soyadı"
- inputText: "Test Yolcu"
# iOS'ta Maestro hideKeyboard React Native girişinde çalışmıyor; Return klavyeyi kapatır.
- pressKey: Enter
- scrollUntilVisible:
    element: '.*KVKK aydınlatma metnini okudum\..*'
    direction: DOWN
- tapOn: '.*KVKK aydınlatma metnini okudum\..*'
- tapOn: ".*Mesafeli satış.*"
- takeScreenshot: m11-bilgiler-dolu
- tapOn: "Rezervasyonu oluştur ve öde"
# Sahte ödeme sayfası uygulama içi Safari'de (SFSafariViewController) açılır. Ayrı süreç olduğu için içeriği
# uygulamaya bağlı akıştan görünmez; dokunuşlar ekran ağacındaki konumlarla yapılır (iPhone 17 Pro, 402x874 pt).
- waitForAnimationToEnd:
    timeout: 10000
# Sayfanın yüklenmesi için bekleme (boş alana uzun basış; Maestro'da düz bekleme komutu yok).
- swipe:
    start: "50%,50%"
    end: "50%,50%"
    duration: 12000
- takeScreenshot: m12-odeme-sayfasi
# "Ödemeyi onayla" [20,329][382,379]
- tapOn:
    point: "50%,40%"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: m13-odeme-sonucu
# Safari "Bitti" [16,62][60,106]: tarayıcı kapanır, uygulama rezervasyonu yeniden yükler.
- tapOn:
    point: "9%,10%"
- extendedWaitUntil:
    visible: "Onaylandı|Atandı|Sürücü.*"
    timeout: 40000
- takeScreenshot: m14-rezervasyon-onaylandi
