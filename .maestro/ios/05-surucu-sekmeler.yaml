# Sürücünün kazanç ve belgeler sekmeleri.
appId: com.getawaytransfers.driver
---
# 03 yolculuk ekranında (başlıksız yığın ekranı, geri düğmesi yok) bitiyor: uygulama yeniden başlatılır,
# oturum korunur ve ana sayfa sekmeleriyle açılır.
- launchApp:
    stopApp: true
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "İzin Ver|Uygulamayı Kullanırken İzin Ver"
    optional: true
- tapOn: ".*Kazanç.*"
- extendedWaitUntil:
    visible: ".*Hakedişler.*"
    timeout: 15000
- takeScreenshot: s09-kazanc
- tapOn: ".*Belgeler.*"
- extendedWaitUntil:
    visible: ".*Onaylı belgelerle.*"
    timeout: 15000
- takeScreenshot: s10-belgeler
