# Müşteri uygulamasında rezervasyon atanmış ve sürücü yolda görünür.
appId: com.getawaytransfers.app
---
- launchApp:
    stopApp: false
# iOS sistem izin uyarısı (bildirim/konum) uygulamanın üstünde kalırsa kapatılır.
- tapOn:
    text: "İzin Ver|Uygulamayı Kullanırken İzin Ver"
    optional: true
- extendedWaitUntil:
    visible: ".*(yolda|Yolda|atandı|Atandı).*"
    timeout: 40000
- takeScreenshot: m15-canli-takip
- scrollUntilVisible:
    element: "Rezervasyonu iptal et"
    direction: DOWN
    optional: true
- takeScreenshot: m16-rezervasyon-alt
# K-59: müşteri uygulaması arka plandayken yolculuk durumu Dynamic Island'da ve bildirim merkezinde.
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m17-canli-etkinlik-ada
- swipe:
    start: "25%,1%"
    end: "25%,75%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m18-canli-etkinlik-bildirim
- swipe:
    start: "50%,98%"
    end: "50%,20%"
    duration: 400
- pressKey: Home
